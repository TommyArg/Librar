spring:
  application:
    name: Librar

  datasource:
    url: jdbc:mariadb://mariadb:3306/librarDB
    username: admin
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:SuperSecret}
      expiration-time: ${JWT_EXPIRATION:86400000}
